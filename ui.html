<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ROMALET · MASTER CORE · IKI · ipT · TMP⁴ · EVOCHAIN</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas, monospace; padding:30px; }
h1 { color:#0ff; margin-bottom:25px; }
.module {
    background:#111;
    padding:20px;
    margin:25px 0;
    border-left:4px solid #0ff;
}
pre {
    background:#111;
    padding:15px;
    border:1px solid #0f0;
    white-space:pre-wrap;
}
button {
    background:#111; color:#0f0; border:1px solid #0ff;
    padding:8px 16px; margin-bottom:20px;
}
</style>
</head>

<body>

<h1>ROMALET · MASTER CORE</h1>

<button onclick="run()">RUN ROMALET SYSTEM</button>

<div class="module">
<h2>ROMALET SYSTEM OUTPUT</h2>
<pre id="out">Bereit...</pre>
</div>

<div class="module">
<h2>Datei‑Status (Auto‑Loader)</h2>
<pre id="files">Lade Dateien…</pre>
</div>

<script type="module">
import { IKI_SYSTEM } from "./iki.js";
import { ipT } from "./ipT.js";

// ------------------------------------------------------
// Datei‑Loader für ALLE ROMALET‑Daten
// ------------------------------------------------------
async function load(path){
    try {
        const r = await fetch(path);
        return await r.text();
    } catch {
        return `FEHLT: ${path}`;
    }
}

async function loadFiles(){
    const data = {
        "ID.html": await load("ID.html"),
        "LAGE.TMP": await load("LAGE.TMP"),
        "LAGE.ort": await load("LAGE.ort"),
        "LAGE.xALL.js": await load("LAGE.xALL.js"),
        "system-check.item": await load("system-check.item"),
        "stufe-bedeutung-5.csv": await load("stufe-bedeutung-5.csv"),
        "README.md": await load("README.md")
    };

    document.getElementById("files").textContent =
        JSON.stringify(data, null, 2);
}

// ------------------------------------------------------
// ROMALET SYSTEM RUN
// ------------------------------------------------------
async function run(){

    const iki = await IKI_SYSTEM(12, 7);
    const ipt = ipT(12, 7);

    const output = {
        ROMALET: "ACTIVE",

        // IKI SYSTEM
        IKI: {
            QI: iki.EVO.QI,
            EVO: iki.EVO.EVO,
            RAW: iki.EVO.RAW,
            TMP: iki.EVO.TMP,
            CORE: iki.EVO.CORE,
            NC_CORE: iki.CORE,
            NC_MULTI: iki.MULTI,
            BENCH: iki.BENCH
        },

        // ipT SYSTEM
        ipT: {
            MODUL: ipt.MODUL,
            SYSTEM: ipt.SYSTEM,
            LAYER: ipt.LAYER,
            STATUS: ipt.STATUS,
            ENGINE: ipt.ENGINE,
            LAGE: ipt.LAGE,
            TMP4: ipt.TMP,
            EVOCHAIN: ipt.EVOCHAIN,
            CONTINIUM: ipt.CONTINIUM,
            UNLINEAR: ipt.UNLINEAR
        },

        // META
        META: {
            VERSION: "GEN‑3",
            MODE: "ALLXALL + TMP⁴",
            BRIDGE: "iki1uc",
            RESPONSE: "4u Layer"
        }
    };

    document.getElementById("out").textContent =
        JSON.stringify(output, null, 2);
}

// ------------------------------------------------------
// Start
// ------------------------------------------------------
loadFiles();
</script>

</body>
</html>
